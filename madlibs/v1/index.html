<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>


    <header>

        <h1> Fashion Week MadLibs</h1>

       <h2> Build your Runway-Ready Look!</h2>


    </header>
    <main>
        <!-- create 5 input elements -->


        <form> 


        <!-- Question One -->


        <div class="questionContainer">
            <label for="questionOne" id="question"> 1. Whose style inspires you? Think of a celebrity, character, or someone you know! </label> 
        <br>

        <input type="text" id ="questionOne" name="questionOne"> <br> 
        </div>
        
        <!-- Question Two -->
        
        
                <div class="questionContainer">

        <label for="questionTwo" id="question"> 2. Which of these shoes would you wear on the runway? </label> 

    <br>
    <input type="radio" id="shoes1" name="shoes" value="shoes1"> 

        <label for="shoes1">Mason Margiela Tabi's </label>  </br> 


        <input type="radio" id="shoes2" name="shoes" value="shoes2"> 

        <label for="shoes2">Doc Martins</label>  </br> 


        
        <input type="radio" id="shoes3" name="shoes" value="shoes3"> 
        <label for="shoes3">Knee High Converse </label> </br> 


        
        <input type="radio" id="shoes4" name="shoes" value="shoes4"> 
        <label for="shoes4">Rick Owens Ramones </label> </br> 


              
        <input type="radio" id="shoes5" name="shoes" value="shoes5"> 
        <label for="shoes5">24k gold Crocs </label> </br> 

                </div>



     <!-- Question Three Pattern -->

 <div class="questionContainer">

 <label for="questionThree" id="question"> 3. Select your favorite patterns </label>  <br> 

     <input type="checkbox" id="pattern1" name="pattern1" value="polkaDots">
     <label for="pattern1"> Polka Dots </label> <br> 


         <input type="checkbox" id="pattern2" name="pattern2" value="gingnam">
     <label for="pattern2"> Stripes </label> <br> 


      <input type="checkbox" id="pattern3" name="pattern3" value="gingnam">
     <label for="pattern3"> Gingnam </label> <br> 


     <input type="checkbox" id="pattern4" name="pattern4" value="gingnam">
     <label for="pattern4"> Florals </label> <br> 

                </div>



        <!-- Question Four Accesories -->

     <div class="questionContainer">

    <label for="questionFour"id="question"> 4.What is your favorite accesory? It can be one you either own or want to own! </label> 
        <br>

        <input type="text" id ="questionFour" name="questionFour"> <br> 
        
                </div>



     <!-- Question Four Accesories -->


          <div class="questionContainer">

    <label for="questionFive" id="question"> 5. Type in an adjective that end with "-ous" </label> 
       
    <br>

        <input type="text" id ="questionFive" name="questionFive"> <br> 
        

                </div>



<input type="submit" name="submit" value="Submit" id="submit" />

        </form>





    </main>

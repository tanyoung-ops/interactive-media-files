function checkColor() {

    var selectedColor=prompt ("Please enter a primary or secondary color", "").toLowerCase (); 

    if (selectedColor === "red" || selectedColor === "blue" || selectedColor === "yellow") { console.log("You picked a primary color"); 
}

else if  (selectedColor === "orange" || selectedColor === "green" || selectedColor === "purple") { console.log ("You picked a secondary color"); 
}

else { 
    console.log ("You did not pick a primary or secondary color"); 
}

} 

checkColor();

upperMessage ("an important message");

addNums (4,3); 


// Returning Data

function returnSum (num1, num2) {

    var sum= num1 + num2; 
    return sum; 
}

console.log (returnSum( 5, 3 )); 

console.log (Math.random () ); 

// Useful Example Step 1

var food =["cheese", "fruit", "chicken", "pie"]; 
function randomInt ( min, max ) {

    var numOfValues = max - min + 1; 
    var randomNum = Math.random (); 
    var randomVal= randomNum * numOfValues; 
    var roundedRandomVal = Math.floor (randomVal); 
    var finalNum = min + roundedRandomVal; 
    
    return finalNum; 
    
}
console.log ( food [randomInt ( 5,10 )] );
